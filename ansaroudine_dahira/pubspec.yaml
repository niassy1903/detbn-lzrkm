
name: ansaroudine_dahira
description: Application mobile pour la Dahira Ansaroudine.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  motion: ^2.0.2
  image_picker: ^1.0.4
  url_launcher: ^6.3.1
  file_picker: ^10.0.0
  path: ^1.9.1
  socket_io_client: ^3.1.4
  flutter_local_notifications: ^17.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - assets/niass1.jpeg
    - assets/niass2.jpeg
    - assets/niass3.jpeg
    - assets/niass4.jpeg
    - assets/niass5.jpeg
    - assets/niass6.jpeg
